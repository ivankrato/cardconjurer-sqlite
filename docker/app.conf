worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    keepalive_timeout  65;
    gzip  on;
    server {
        listen 4242 default_server;
        server_name localhost;
        root  /usr/share/nginx/html;
        client_max_body_size 50m;
        index index.html index.htm;
        location ~* \.(?:manifest|appcache|html?|xml|json)$ {
          expires -1;
        }
        location ~* \.(?:css|js)$ {
          try_files $uri =404;
          expires 1y;
          access_log off;
          add_header Cache-Control "public";
        }
        # Any route containing a file extension (e.g. /devicesfile.js)
        location ~ ^.+\..+$ {
          try_files $uri =404;
        }
        # Proxy API requests to the internal API port (3001) – never tunnelled
        location /api/ {
            proxy_pass         http://cardserver:3001;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Card gallery page (public port 3000)
        location = /cards {
            proxy_pass         http://cardserver:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Card images served by Node (public port 3000)
        location ^~ /card-images/ {
            proxy_pass         http://cardserver:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # Any route that doesn't have a file extension (e.g. /devices)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
